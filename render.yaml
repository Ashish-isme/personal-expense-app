# Render Blueprint — deploys the backend API.
# In the Render dashboard: New + → Blueprint → point at this repo.
#
# The database is an external managed Postgres (e.g. a free Neon project), NOT a
# file on this service. Render's free instances have an ephemeral filesystem and
# don't support persistent disks, so a SQLite file would be destroyed on every
# restart, redeploy and spin-down. Keeping the data in Postgres means the web
# service can be wiped and restarted freely without losing anything.
services:
  - type: web
    name: finance-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    # Install deps + generate the Prisma client at build time.
    buildCommand: npm install && npx prisma generate
    # Sync the schema to the database, then start the API.
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /api/health
    envVars:
      # Paste your Neon (or other managed Postgres) connection string here in the
      # Render dashboard. Must include ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Signing key for auth tokens. Render generates a strong random value —
      # without this the API falls back to an insecure development default.
      - key: JWT_SECRET
        generateValue: true
      # Protects the month-end summary endpoint that an external cron calls.
      - key: CRON_SECRET
        generateValue: true
      # SMTP is optional — without it, month-end summaries still arrive in-app
      # and email is simply skipped. Set these in the Render dashboard to enable
      # email (for Gmail, use an App Password, not your account password).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CORS_ORIGIN
        # Set this to your Vercel frontend URL after deploying the frontend.
        value: "*"
      - key: NODE_VERSION
        value: "20"
