# Render Blueprint — deploys the backend API with a persistent SQLite disk.
# In the Render dashboard: New + → Blueprint → point at this repo.
services:
  - type: web
    name: finance-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    # Install deps + generate the Prisma client at build time.
    buildCommand: npm install && npx prisma generate
    # Ensure the schema exists on the mounted disk, then start the API.
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/finance.db
      # Signing key for auth tokens. Render generates a strong random value —
      # without this the API falls back to an insecure development default.
      - key: JWT_SECRET
        generateValue: true
      # Protects the month-end summary endpoint that an external cron calls.
      - key: CRON_SECRET
        generateValue: true
      # SMTP is optional — without it, month-end summaries still arrive in-app
      # and email is simply skipped. Set these in the Render dashboard to enable
      # email (for Gmail, use an App Password, not your account password).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CORS_ORIGIN
        # Set this to your Vercel frontend URL after deploying the frontend.
        value: "*"
      - key: NODE_VERSION
        value: "20"
    # Persistent disk so the SQLite database survives restarts/redeploys.
    disk:
      name: finance-data
      mountPath: /var/data
      sizeGB: 1
